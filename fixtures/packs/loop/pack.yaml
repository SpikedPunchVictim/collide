apiVersion: collide/v0
name: loop
version: 0.1.0

# A review loop (0.7): build, review, then fix or close. The roles, prompts, gate, hooks and decision script the
# phases name are declared here, as paths relative to the pack directory; the fixture holds no files, so a test
# reads the manifest and never runs it.
requires:
  sdk: ">=0.1 <0.2"
  tools:
    - { name: node, version: ">=22.18" }
  agents: [claude]

launch:
  max_rounds: { type: integer, minimum: 1, default: 3 }

config:
  evidenceFile: { type: string, default: evidence.json }
  notifyHook: { type: string, secret: true }
  lanePool: { type: integer, minimum: 1, default: 2, overridable: true }

integrations:
  merge-local: { script: hooks/merge-local.ts }

roles:
  builder:
    agent: claude
    definition: agents/builder.md
    model: fast
    budget: { usd: 10 }
  reviewer:
    agent: claude
    definition: agents/reviewer.md
    model: strong
    readOnly: true
  orchestrator:
    agent: claude
    definition: agents/orchestrator.md
    model: strong
    readOnly: true
    compact_at: 120000

prompts:
  build: briefs/build.md.j2
  review: briefs/review.md.j2
  adjudicate: briefs/adjudicate.md.j2

gates:
  evidence:
    script: gates/evidence.ts
    timeout: 5m

workflows:
  loop:
    accepts: { sources: [plan] }
    integrate: loop/merge-local
    on_start: [{ op: setStatus, args: { category: active } }]
    on_end: [{ op: setStatus, args: { category: review }, when: 'outcome == "closed"' }]
    start: build
    phases:
      build: { role: builder, prompt: build, label: build, gates: [evidence] }
      review:
        role: reviewer
        prompt: review
        label: "r{{ round }}-{{ model.name }}"
        sandbox: { models: [strong] }
        on_cold: fresh
        fanout: { models: [strong, fast], when: "round == 1" }
      adjudicate:
        role: orchestrator
        prompt: adjudicate
        outputs: [round-record.md, fix-brief.md]
        record: true
        then:
          script: workflow/next.ts
          tokens: [fix, close, stop]
          on: { fix: fix, close: close, stop: ask_human }
          show: [adjudicate/round-record.md]
      fix: { role: builder, prompt: { artifact: adjudicate/fix-brief.md }, label: "fix{{ round }}", gates: [evidence], then: review }
      close: { role: builder, prompt: { artifact: adjudicate/fix-brief.md }, label: close, gates: [evidence], then: { end: closed } }
