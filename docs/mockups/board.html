    if (db) db.scrollTop = db.scrollHeight;
  }
  document.body.style.setProperty('--dockb', `${docked ? dk.offsetHeight : 0}px`);
  $('#tip').hidden = true;
  document.body.classList.toggle('notes', state.notes);
  $('#mock').hidden = !state.mock;
  $('#mockbtn').setAttribute('aria-expanded', String(state.mock));
  if (state.mock) $('#mock').innerHTML = mockHtml();
}

/* ---------- modal and toast ---------- */
function modal(html, cls = '') {
  $('#modal').className = `modal ${cls}`;
  $('#modal').innerHTML = html;
  $('#overlay').hidden = false;
  $('#modal').querySelector('input,button.main,button')?.focus();
}
function closeModal() { $('#overlay').hidden = true; }
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3600);
}
function flash(id) {
  state.flash.add(id);
  state.updated = Date.now();
  setTimeout(() => state.flash.delete(id), 2100);
}
function resetFilters() {
  state.filt = { stage: new Set(), cat: new Set(), src: new Set(), text: '', deps: false };
  state.ask = null;
}
function goBoard(id, viewId) {
  state.board = id;
  state.view = viewId || state.boards[id].views[0].id;
  state.screen = 'board';
  state.settings = false;
  state.surface = 'field';
  state.drawer = null;
  state.goal = null;
  resetFilters();
}

/* ---------- scenarios ---------- */
function scenario(v) {
  const b = state.boards;
  switch (v) {
    case 'collide': state.layout = 'board'; state.groupBy = 'auto'; goBoard('collide'); break;
    case 'pantry': state.layout = 'board'; state.groupBy = 'auto'; goBoard('pantry', 'tracker'); break;
    case 'mixed': state.layout = 'board'; state.groupBy = 'auto'; goBoard('pantry', 'everything'); break;
    case 'runorder': goBoard('collide', 's5'); state.layout = 'run'; break;
    case 'hostile': goBoard('collide', 's6'); state.layout = 'board'; state.drawer = 'fx-0001-hb'; break;
    case 'fresh': case 'nogit': case 'logout':
      state.welcome = { folder: v === 'nogit' ? '~/notes' : '~/projects/my-app', git: v !== 'nogit', claude: true,
        login: v !== 'logout' };
      state.screen = 'welcome';
      state.drawer = null;
      break;
    case 'missing': b.old.missing = true; goBoard('old'); break;
    case 'clone':
      goBoard('pantry', 'everything');
      b.pantry.untrusted = true;
      trustModal();
      break;
    case 'settings':
      if (state.screen !== 'board' || board().missing) goBoard('collide');
      state.settings = true; state.stab = 'general'; state.drawer = null; break;
    case 'sim-finish': {
      if (state.board !== 'collide') goBoard('collide');
      const t = byId('ts-0178-fw');
      t.status = 'review';
      t.copies = { r121: 'review' };
      flash(t.id);
      break;
    }
    case 'sim-diverge': {
      if (state.board !== 'collide') goBoard('collide');
      const t = byId('ts-0168-tq');
      t.copies = { r121: 'active' };
      flash(t.id);
      break;
    }
    case 'graph': goBoard('collide', 's5'); state.layout = 'graph'; break;
    case 'ask': goBoard('collide'); state.layout = 'board'; render(); runAsk(ASK_EXAMPLES[0]); return;
    case 'changes': goBoard('collide', 's6'); state.layout = 'board'; state.drawer = 'ts-0178-fw'; break;
    case 'changes2': goBoard('collide'); state.layout = 'board'; state.drawer = 'ts-0160-th'; break;
    case 'fields': state.layout = 'board'; goBoard('pantry', 'tracker'); state.drawer = 'PT-3'; break;
    case 'comms': if (state.screen !== 'board' || board().missing) goBoard('collide');
      state.surface = 'comms'; state.settings = false; state.comm = 'flaky'; break;
    case 'tracks': goBoard('collide'); Object.assign(state, { surface: 'tracks', track: 'r121', tphase: null,
      ttab: 'table' }); break;
    case 'optimize': goTracks('Build', 'table'); render(); optimizeModal('cargo'); return;
    case 'tracks-phase': goTracks('Plan', 'table'); break;
    case 'tracks-tl': goTracks(null, 'timeline'); break;
    case 'opt-pick': case 'bake':
      goTracks('Build', 'table'); render(); optimizeModal('cargo');
      state.optSel = new Set(v === 'bake' ? [0, 1, 2] : [0, 1]);
      if (v === 'bake') bakeResult('cargo'); else optimizeResult('cargo');
      return;
    case 'opt-comms':
      goTracks('Build', 'table'); state.optCtx = optContext('cargo'); state.optSel = new Set([0, 1, 2]);
      optSession('cargo', true); break;
    case 'whole': goBoard('collide', 's6'); state.layout = 'board'; state.drawer = 'ts-0178-fw';
      state.diffView = 'whole'; render(); diffModal('ts-0178-fw', 0); return;
    case 'cnotes': case 'pins':
      if (state.screen !== 'board' || board().missing) goBoard('collide');
      Object.assign(state, { surface: 'comms', settings: false, comm: 'flaky', cview: 'convo' });
      if (v === 'cnotes') { render(); notesModal(); return; }
      break;
    case 'dock': case 'dockterm':
      goBoard('collide');
      Object.assign(state, { dock: 'open', dockSess: 'desk', dview: v === 'dock' ? 'chat' : 'term', ddraft: '' });
      break;
    case 'plansess': case 'plansess-q': case 'plansess-term':
      goBoard('collide');
      startPlanSession();
      Object.assign(state, { ptab: v === 'plansess-q' ? 'quality' : 'plan', pview: v === 'plansess-term'
        ? 'term' : 'chat', pdraft: '' });
      break;
    case 'peek': {
      goBoard('collide', 'all');
      Object.assign(state, { layout: 'board', drawer: 'ts-0176-ds' });
      render();
      const ref = [...document.querySelectorAll('#drawer .idref')].find((r) => findItem(r.dataset.id));
      if (ref) showPeek(ref, true);
      return;
    }
    case 'fold': goBoard('collide', 'all'); state.layout = 'board'; state.ffold.add('collide'); break;
    case 'dfold':
      goBoard('collide', 's6');
      Object.assign(state, { layout: 'board', drawer: 'ts-0178-fw', dw: 640,
        dshut: new Set(['Description', 'Waits on', 'Part of']) });
      break;
    case 'needs':
      goBoard('collide', 'open');
      Object.assign(state, { layout: 'board', drawer: 'ts-0178-fw', dshut: new Set() });
      break;
    case 'queue': goBoard('collide'); state.surface = 'queue'; break;
    case 'hubs': goBoard('collide', 'hubs'); state.layout = 'board'; break;
    case 'auto-setup': goBoard('collide', 's6'); state.layout = 'board'; render(); autoModal(); return;
    case 'auto-on':
      goBoard('collide', 's6');
      if (!state.auto.on) { render(); autoModal(); startAutopilot(); }
      state.layout = 'next';
      break;
    case 'upnext': goBoard('collide', 's6'); state.layout = 'next'; break;
    case 'grouping': goBoard('collide', 's6'); state.layout = 'next'; render(); grpModal(); return;
    case 'qkeep':
      if (state.screen !== 'board' || board().missing) goBoard('collide');
      Object.assign(state, { settings: true, stab: 'general', drawer: null });
      break;
    case 'reset': {
      const notes = state.notes;
      state.boards = freshBoards();
      Object.assign(state, { layout: 'board', groupBy: 'auto', open: new Set(), shut: new Set(), notes,
        comms: JSON.parse(JSON.stringify(COMMS)), comm: 'flaky', cview: 'convo', track: 'r121', ttab: 'table',
        minSecs: 0, toolType: 'all', cq: '', tphase: null, optCtx: null, optSel: new Set(), optCap: false,
        optTime: false, diffView: 'changes', dock: false, dockSess: 'desk', dview: 'chat', ddraft: '',
        psess: null, ptab: 'plan', pview: 'chat', pdraft: '', ffold: new Set(), dshut: new Set(), dw: 460,
        qa: clone(QA), qkeep: 'task', qdraft: {}, auto: clone(AUTO), unext: clone(UP_NEXT), overlap: false });
      goBoard('collide');
      break;
    }
  }
  state.menu = null;
  render();
}
function goTracks(phase, tab) {
  goBoard('collide');
  Object.assign(state, { surface: 'tracks', track: 'r121', tphase: phase, ttab: tab, toolType: 'all', minSecs: 0 });
}
function trustModal() {
  modal(`<h2>Trust the packs this repo brings?</h2>
    <p><b>pantry</b> brings one pack of its own: <code>demo/tracker</code>. A pack runs code on this Mac, with your
      permissions, to read its tasks.</p>
    <ul><li>From: <code>.collide/packs/tracker</code> in this repo</li><li>It reads: the tracker service at
      <code>tracker.example</code></li></ul>
    <p class="muted">The built-in packs need no trust. You can trust it later from Settings, Packs.</p>
    <div class="acts"><button class="btn" data-act="trust-no">Open without it</button>
      <button class="btn main" data-act="trust-yes">Trust and open</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (state.menu && !e.target.closest('.pop') && !(el && el.dataset.act === 'menu')) {
    state.menu = null;
    if (!el) { render(); return; }
  }
  if (!el) return;
  const { act, id, v, g } = el.dataset;
  const b = board();
  switch (act) {
    case 'menu': state.menu = state.menu === el.dataset.menu ? null : el.dataset.menu; break;
    case 'board': goBoard(id); break;
    case 'view': state.view = id; state.goal = null; state.menu = null; resetFilters(); break;
    case 'tab': state.surface = id; state.settings = false; break;
    case 'layout': state.layout = v; break;
    case 'group': state.groupBy = v; break;
    case 'chip': { const s = state.filt[g]; s.has(v) ? s.delete(v) : s.add(v); break; }
    case 'clear': resetFilters(); break;
    case 'open': state.drawer = id; break;
    case 'close': state.drawer = null; break;
    case 'col': {
      const col = { key: v, cat: '' };
      const shut = state.shut.has(v) || (!state.open.has(v) && e.target.closest('.col.shut'));
      if (shut) { state.shut.delete(v); state.open.add(v); } else { state.open.delete(v); state.shut.add(v); }
      void col;
      break;
    }
    case 'settings': state.settings = !state.settings; state.drawer = null; break;
    case 'stab': state.stab = v; break;
    case 'theme': {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      return;
    }
    case 'mock': state.mock = !state.mock; break;
    case 'notes': state.notes = !state.notes; break;
    case 'scn': scenario(v); return;
    case 'toast': toast(v); return;
    case 'copy': toast('Copied.'); return;
    case 'ext': e.preventDefault(); extModal(el.dataset.href); return;
    case 'ext-yes': closeModal(); toast('Your browser opens the link.'); return;
    case 'modal-close': closeModal(); return;
    case 'save-view': saveViewModal(); return;
    case 'save-yes': saveView(); return;
    case 'share': shareModal(); return;
    case 'share-yes': b.shared = true; closeModal(); toast('Wrote .collide/ to the repo. Commit it to share.'); break;
    case 'trust': trustModal(); return;
    case 'trust-yes': b.untrusted = false; closeModal(); toast('demo/tracker is trusted for this repo.'); break;
    case 'trust-no': closeModal(); break;
    case 'locate': locateModal(); return;
    case 'locate-yes': {
      const p = $('#locpath').value.trim() || b.folder;
      b.folder = p; b.missing = false; closeModal();
      toast(`Found it. ${b.tasks.length} tasks and the Up next list are as they were.`);
      break;
    }
    case 'gitinit': gitInitModal(); return;
    case 'gitinit-yes': state.welcome.git = true; closeModal(); toast('Made a git repository.'); break;
    case 'recheck': state.welcome.login = true; state.welcome.claude = true; toast('Checked again.'); break;
    case 'openfresh': openFresh(); break;
    case 'scratch': addScratch(); break;
    case 'addpack': toast('Add a pack: pick a built-in pack or a folder. (Not designed yet.)'); return;
    case 'secret': secretModal(); return;
    case 'secret-yes': closeModal(); toast('Saved to your keychain.'); return;
    case 'ask': runAsk(($('#askq') && $('#askq').value) || ''); return;
    case 'ask-ex': runAsk(v); return;
    case 'ask-keep': state.ask = null; break;
    case 'ask-undo': if (state.ask && state.ask.prev) state.filt = state.ask.prev; state.ask = null; break;
    case 'deps-off': state.filt.deps = false; break;
    case 'diff': diffModal(id, Number(v)); return;
    case 'track': Object.assign(state, { track: v, tphase: null, surface: 'tracks', settings: false }); break;
    case 'phase': Object.assign(state, { track: v, tphase: id, surface: 'tracks', settings: false }); break;
    case 'ttab': state.ttab = v; break;
    case 'optimize': optimizeModal(v); return;
    case 'opt-go': optimizeWorking(v); return;
    case 'opt-back': optimizeResult(v); return;
    case 'opt-tasks': {
      const ids = picks().map((i) => fileOpt(OPTIMIZE[v], state.optCtx, i));
      closeModal();
      toast(`Filed ${words(ids)} in Backlog, with the research in ${ids.length > 1 ? 'each' : 'its'} body. `
        + 'Nothing runs '
        + 'until you start it.');
      break;
    }
    case 'bake': bakeModal(v); return;
    case 'bake-go': bakeWorking(v); return;
    case 'bake-task': {
      const o = OPTIMIZE[v], i = Number(id), [m, tests, , , detail] = o.bake.arms[i];
      const tid = fileOpt(o, state.optCtx, i, `${fmt(m)} median against ${fmt(o.bake.base[0])} today, ${tests}. `
        + detail);
      closeModal();
      toast(`Filed ${tid} in Backlog, with the research and the bake-off in its body.`);
      break;
    }
    case 'opt-comms':
      closeModal();
      optSession(v, id === 'bake');
      toast('Opened a Comms session that says where it came from, what you saw, and the research.');
      break;
    case 'comm': state.comm = v; break;
    case 'cview': state.cview = v; break;
    case 'notes-open': notesModal(); return;
    case 'pin': {
      const s = curSess(), t = s.turns[Number(v)];
      (s.pins ||= []).push({ turn: Number(v), text: t.result, at: t.at, pinnedAt: clock() });
      toast('Pinned. It stays in Pinned, however long the conversation grows.');
      break;
    }
    case 'unpin': curSess().pins.splice(Number(v), 1); closeModal(); break;
    case 'unpin-turn': { const s = curSess(); s.pins = s.pins.filter((p) => p.turn !== Number(v)); break; }
    case 'pin-open': pinModal(Number(v)); return;
    case 'pin-task': fileTurnModal(curSess().pins[Number(v)].turn); return;
    case 'diffv': state.diffView = v; diffModal(id, Number(el.dataset.x)); return;
    case 'dock':
      if (state.surface === 'comms' && !state.settings) { state.comm = 'desk'; state.dock = 'open'; break; }
      state.dock = state.dock ? false : 'open';
      break;
    case 'dock-min': state.dock = state.dock === 'min' ? 'open' : 'min'; break;
    case 'dock-close': state.dock = false; break;
    case 'dock-comms': Object.assign(state, { surface: 'comms', comm: state.dockSess, settings: false }); break;
    case 'dview': state.dview = v; break;
    case 'dsend': {
      const text = ($('#dmsg') && $('#dmsg').value.trim()) || '';
      if (!text) return;
      const s = dockSess();
      s.live = true; s.last = clock();
      s.turns.push(tl(clock(), text, 3, [['query', 1]], 'The mock does not run an agent. In the app the answer '
        + 'arrives here, and Comms shows the same conversation.', 0));
      state.ddraft = '';
      break;
    }
    case 'discuss':
      Object.assign(state, { dock: 'open', dockSess: 'desk', dview: 'chat' });
      state.ddraft = `${state.ddraft ? `${state.ddraft} ` : ''}${id} `;
      if (state.surface === 'comms') state.surface = 'field';
      render();
      { const m = $('#dmsg'); if (m) { m.focus(); m.setSelectionRange(m.value.length, m.value.length); } }
      return;
    case 'newsess': newSessionModal(); return;
    case 'newsess-yes': {
      const tree = $('input[name=swhere]:checked').value === 'tree';
      newSession($('#sname').value.trim() || 'A new session', $('#spurpose').value.trim(), $('#sagent').value,
        tree ? 'a fresh worktree' : board().folder);
      closeModal();
      break;
    }
    case 'endsess': endModal(); return;
    case 'endsess-yes': {
      const s = curSess(), del = $('#delpins') && $('#delpins').checked, n = (s.pins || []).length;
      s.live = false; s.last = clock();
      if (del) s.pins = [];
      closeModal();
      toast(`Ended "${s.title}".${del && n ? ` Deleted its ${n} pin${n === 1 ? '' : 's'}.` : ''}`);
      break;
    }
    case 'send': {
      const text = $('#cmsg').value.trim();
      if (!text) return;
      const s = state.comms.find((x) => x.id === state.comm) || state.comms[0];
      s.live = true; s.last = clock();
      s.turns.push(tl(clock(), text, 4, [], 'The mock does not run an agent. In the app the answer arrives here, '
        + 'with the work folded above it.', 0));
      break;
    }
    case 'file-turn': fileTurnModal(Number(v)); return;
    case 'file-turn-yes': {
      const s = state.comms.find((x) => x.id === state.comm), t = s.turns[Number(v)];
      const tid = fileTask($('#ftitle').value.trim() || 'A task from Comms', `## Goal\n\n${t.result}\n\nFrom the `
        + `Comms session "${s.title}", ${s.day} ${t.at}.`);
      closeModal();
      toast(`Filed ${tid} in Backlog. The task links back to this session.`);
      break;
    }
    case 'plan': planModal(); return;
    case 'plan-yes': closeModal(); startPlanSession(); break;
    case 'peek':
      if (el.closest('#peek')) { PEEK.stack.push(id); PEEK.pinned = true; drawPeek(); } else showPeek(el, true);
      return;
    case 'peek-back': PEEK.stack.pop(); drawPeek(); return;
    case 'peek-close': hidePeek(); return;
    case 'peek-open':
      hidePeek();
      if (!byId(id)) {
        toast(`In the app the drawer opens ${id}. This mock's drawer shows this board's tasks.`);
        return;
      }
      state.drawer = id; break;
    case 'ptab': state.ptab = v; break;
    case 'pview': state.pview = v; break;
    case 'pclose': state.psess = null; break;
    case 'psess-open': startPlanSession(); break;
    case 'psess-comms': Object.assign(state, { surface: 'comms', comm: state.psess, cview: 'convo' }); break;
    case 'ptype':
      Object.assign(state, { pview: 'chat', pdraft: `${state.pdraft ? `${state.pdraft} ` : ''}${v}` });
      render();
      { const m = $('#pmsg'); if (m) { m.focus(); m.setSelectionRange(m.value.length, m.value.length); } }
      return;
    case 'psend': {
      const text = $('#pmsg').value.trim();
      if (!text) return;
      const s = planSess();
      s.last = clock();
      s.turns.push(tl(clock(), text, 4, [], 'The mock does not run an agent. In the app the answer arrives here, '
        + 'and what it writes shows in the panel.', 0));
      state.pdraft = '';
      break;
    }
    case 'ffold':
      if (state.ffold.has(state.board)) state.ffold.delete(state.board); else state.ffold.add(state.board);
      break;
    case 'dsec': {
      if (state.dshut.has(v)) state.dshut.delete(v); else state.dshut.add(v);
      render();
      const back = [...document.querySelectorAll('#drawer .dsh')].find((x) => x.dataset.v === v);
      if (back) back.focus();
      return;
    }
    case 'qpick': {
      const ta = $(`#qans-${v}`);
      if (ta) { ta.value = el.dataset.o; state.qdraft[`${state.drawer}:${v}`] = ta.value; ta.focus(); }
      return;
    }
    case 'qsend': {
      const ta = $(`#qans-${v}`);
      const text = ta ? ta.value.trim() : '';
      if (!text) { toast('Write an answer, or pick one the agent offers.'); return; }
      const q = state.qa[id][Number(v)];
      Object.assign(q, { a: text, by: 'You', when: `Today ${clock()}` });
      delete state.qdraft[`${id}:${v}`];
      const kept = { task: 'in the task\'s file', items: 'as a question item', local: 'on this Mac' }[state.qkeep];
      toast(`Sent to ${q.run}; it goes on. ${kept ? `Kept ${kept}.` : 'Not kept once the run ends.'}`);
      break;
    }
    case 'qkeep-set': Object.assign(state, { settings: true, stab: 'general', drawer: null }); break;
    case 'qopen': state.drawer = id; break;
    case 'auto': autoModal(); return;
    case 'auto-yes': startAutopilot(); break;
    case 'auto-pause':
      state.auto.paused = !state.auto.paused;
      toast(state.auto.paused ? 'Autopilot paused: nothing new starts; runs that started go on.'
        : 'Autopilot goes on.');
      break;
    case 'auto-stop':
      Object.assign(state.auto, { on: false, paused: false });
      toast('Autopilot is off. Runs that started go on; Up next stays as it is.');
      break;
    case 'ue-up': case 'ue-down': {
      const i = Number(v), j = act === 'ue-up' ? i - 1 : i + 1, u = state.unext;
      if (j < 0 || j >= u.length) return;
      [u[i], u[j]] = [u[j], u[i]];
      break;
    }
    case 'ue-x': state.unext.splice(Number(v), 1); toast('Removed from Up next. The task stays on the board.'); break;
    case 'ue-keep': delete state.unext[Number(v)].proposed; toast('Group kept. It runs as one entry.'); break;
    case 'ue-split': {
      const grp = state.unext[Number(v)];
      state.unext.splice(Number(v), 1, ...grp.tasks.map((x) => ({ kind: 'task', tasks: [x], by: 'you' })));
      toast(`${grp.name}: split into ${grp.tasks.length} entries.`);
      break;
    }
    case 'overlap': state.overlap = !state.overlap; break;
    case 'grp': grpModal(); return;
    case 'grp-yes': {
      const ids = [...document.querySelectorAll('.gpick:checked')].map((x) => x.value);
      if (ids.length < 2) { toast('Pick two tasks or more for a group.'); return; }
      const mode = document.querySelector('input[name=gmode]:checked').value;
      const name = $('#gname').value.trim() || 'A group';
      state.unext = state.unext.map((x) => ({ ...x, tasks: x.tasks.filter((k) => !ids.includes(k)) }))
        .filter((x) => x.tasks.length);
      state.unext.push({ kind: 'group', name, tasks: ids, mode, by: 'you' });
      state.layout = 'next';
      closeModal();
      toast(`${name}: added to Up next, ${MODES[mode][0].toLowerCase()}.`);
      break;
    }
    default: return;
  }
  render();
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'qkeep') { state.qkeep = e.target.value; render(); return; }
  if (e.target.classList.contains('umode')) {
    state.unext[Number(e.target.dataset.v)].mode = e.target.value;
    render();
    return;
  }
  if (e.target.classList.contains('gpick')) {
    $('#gest').innerHTML = grpEst(document.querySelectorAll('.gpick:checked').length);
    return;
  }
  if (e.target.id === 'goal') { state.goal = e.target.value; render(); }
  if (e.target.id === 'ttype') { state.toolType = e.target.value; render(); }
  if (e.target.id === 'tmin') { state.minSecs = Number(e.target.value); render(); }
  if (e.target.id === 'dsess') { state.dockSess = e.target.value; render(); }
  if (e.target.id === 'optcap' || e.target.id === 'opttime') {
    const cap = e.target.id === 'optcap';
    state[cap ? 'optCap' : 'optTime'] = e.target.checked;
    $(cap ? '#capv' : '#timev').classList.toggle('over', e.target.checked);
    $(cap ? '#capnote' : '#timenote').hidden = !e.target.checked;
  }
  if (e.target.classList.contains('optpick')) {
    const i = Number(e.target.value);
    if (e.target.checked) state.optSel.add(i); else state.optSel.delete(i);
    pickCount();
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'nwrite' || id === 'cpurpose') {
    const s = curSess();
    s[id === 'nwrite' ? 'notes' : 'purpose'] = e.target.value;
    state.saved = clock();
    const words = `Saved on this Mac at ${state.saved}. Only you see them.`;
    ['#csaved', '#nsaved'].forEach((sel) => { const c = $(sel); if (c) c.textContent = words; });
    if (id === 'nwrite') {
      const html = mdHtml(s.notes);
      $('#nprev').innerHTML = html;
      const p = $('.npv');
      if (p) p.innerHTML = html || '<p class="muted">No notes yet. Open notes to write some, in Markdown.</p>';
    }
    return;
  }
  if (id.startsWith('qans-')) { state.qdraft[`${state.drawer}:${id.slice(5)}`] = e.target.value; return; }
  if (id === 'dmsg') { state.ddraft = e.target.value; return; }
  if (id !== 'ftext' && id !== 'cq') return;
  if (id === 'ftext') state.filt.text = e.target.value; else state.cq = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const f = $(`#${id}`);
  if (f) { f.focus(); f.setSelectionRange(pos, pos); }
});
function placeTip(e) {
  const t = $('#tip'), w = t.offsetWidth, ht = t.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + ht > innerHeight - 8) y = e.clientY - ht - 12;
  t.style.left = `${Math.max(8, x)}px`;
  t.style.top = `${Math.max(8, y)}px`;
}
document.addEventListener('mouseover', (e) => {
  const n = e.target.closest && e.target.closest('.gnode');
  if (n) lightGraph(n.dataset.id);
  const bar = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (bar && TIPS[bar.dataset.tip]) { tip.innerHTML = TIPS[bar.dataset.tip]; tip.hidden = false; placeTip(e); }
  else if (!tip.hidden) tip.hidden = true;
});
document.addEventListener('mousemove', (e) => { if (!$('#tip').hidden) placeTip(e); });
document.addEventListener('mouseout', (e) => {
  if (e.target.closest && e.target.closest('.gnode') && !(e.relatedTarget && e.relatedTarget.closest
    && e.relatedTarget.closest('.gnode'))) lightGraph(null);
});
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (!$('#overlay').hidden) closeModal();
    else if (state.menu) { state.menu = null; render(); }
    else if (state.drawer) { state.drawer = null; render(); }
    else if (state.settings) { state.settings = false; render(); }
    return;
  }
  if (e.key === 'Enter' && document.activeElement.id === 'askq') { runAsk(document.activeElement.value); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement.id === 'cmsg') {
    $('[data-act=send]').click(); return;
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement.id === 'dmsg') {
    $('[data-act=dsend]').click(); return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const tab = { 1: 'field', 2: 'tracks', 3: 'queue', 4: 'planning', 5: 'comms' }[e.key];
  if (tab && state.screen === 'board') { state.surface = tab; state.settings = false; render(); }
  if (e.key === '/') {
    if (state.ffold.has(state.board) && state.surface === 'field') { state.ffold.delete(state.board); render(); }
    const f = $('#ftext');
    if (f) { e.preventDefault(); f.focus(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.matches('.col.shut')) {
    e.preventDefault(); document.activeElement.click();
  }
});
$('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeModal(); });

/* ---------- modals ---------- */
function extModal(href) {
  let host = href;
  try { host = new URL(href.replace(/&amp;/g, '&')).host; } catch (err) { /* shown as written */ }
  modal(`<h2>Open this link in your browser?</h2><p>It leads to <b>${esc(host)}</b>:</p>
    <p class="mono" style="overflow-wrap:anywhere;font-size:13px">${href}</p>
    <p class="muted">The link came from a task's text. Collide does not open links by itself.</p>
    <div class="acts"><button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn main" data-act="ext-yes">Open in browser</button></div>`);
}
function saveViewModal() {
  modal(`<h2>Save as a view</h2><label for="vname">Name</label>
    <input type="text" id="vname" value="${esc(state.filt.text ? `Search: ${state.filt.text}` : 'My view')}">
    <p class="muted">The view is kept for you. Share with team writes it to <code>.collide/views/</code>, with this
      expression:</p><pre class="mono" style="background:var(--code-bg);padding:8px;border-radius:7px;
      font-size:12.5px;overflow-x:auto;margin:0">${esc(celOf())}</pre>
    <div class="acts"><button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn main" data-act="save-yes">Save view</button></div>`);
}
function saveView() {
  const name = $('#vname').value.trim() || 'My view';
  const f = state.filt;
  const snap = { stage: new Set(f.stage), cat: new Set(f.cat), src: new Set(f.src), text: f.text };
  const base = view();
  const id = 'mine-' + Date.now();
  board().views.push({ id, name, mine: true, where: celOf().replace(/\n\s+/g, ' '), goal: base.goal,
    test: (t) => base.test(t) && (!snap.stage.size || snap.stage.has(t.epic))
      && (!snap.cat.size || snap.cat.has(catOf(t))) && (!snap.src.size || snap.src.has(t.src))
      && (!snap.text || (t.title + ' ' + t.id).toLowerCase().includes(snap.text.toLowerCase())) });
  state.view = id;
  resetFilters();
  closeModal();
  toast(`Saved "${name}" as your view.`);
  render();
}
function shareModal() {
  modal(`<h2>Share this board with your team?</h2><p>Collide writes these files into the repo. Nothing is committed;
    you commit them like any change.</p><ul class="mono" style="font-size:13px"><li>.collide/board.yaml</li>

}
function locateModal() {
  modal(`<h2>Locate ${esc(board().name)}</h2><label for="locpath">Where is the folder now?</label>
    <input type="text" id="locpath" value="~/projects/old-check">

function gitInitModal() {

    <code>.git</code> folder and changes nothing else.</p>

function secretModal() {
  modal(`<h2>Set a secret</h2><label for="sec">Value</label><input type="text" id="sec" placeholder="Paste it here"
    autocomplete="off"><p class="muted">It goes into your Mac's keychain. Collide will not show it again.</p>
    <div class="acts"><button class="btn" data-act="modal-close">Cancel</button>

let DIFFS = null;
function diffOf(path) {
  if (!DIFFS) {
    DIFFS = {};
    $('#diffs-0178').textContent.split(/^### FILE /m).slice(1).forEach((chunk) => {
      const nl = chunk.indexOf('\n');
      DIFFS[chunk.slice(0, nl).trim()] = chunk.slice(nl + 1).replace(/\n+$/, '');
    });
  }
  return DIFFS[path];
}
let WHOLE = null;
// The whole file after the change. A line that starts with "~" continues the line before it.
function wholeOf(path) {
  if (!WHOLE) {
    WHOLE = {};
    $('#whole-0178').textContent.split(/^### FILE /m).slice(1).forEach((chunk) => {
      const nl = chunk.indexOf('\n'), out = [];
      chunk.slice(nl + 1).replace(/\n+$/, '').split('\n').forEach((l) => {
        if (l[0] === '~' && out.length) out[out.length - 1] += l.slice(1); else out.push(l);
      });
      WHOLE[chunk.slice(0, nl).trim()] = out;
    });
  }
  return WHOLE[path];
}
function diffModal(id, i) {
  const ch = CHANGES[id], f = ch.files[i], view = state.diffView;
  const real = id === 'ts-0178-fw' && f.diff;
  const text = real && view === 'changes' ? diffOf(f.path) : null;
  const whole = real && view === 'whole' ? wholeOf(f.path) : null;
  let n = 0;
  const body = text ? `<pre class="diff">${text.split('\n').map((l) => `<span class="${l.startsWith('@@') ? 'h'
    : l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : ''}">${esc(l) || ' '}</span>`).join('')}</pre>`
    : whole ? `<pre class="diff whole" id="wholepre">${whole.map((l) => {
      const k = l[0] === '-' ? 'd' : l[0] === '+' ? 'a' : '';
      if (k !== 'd') n += 1;
      return `<span class="${k}"><i>${k === 'd' ? '' : n}</i>${esc(l.slice(1)) || ' '}</span>`;
    }).join('')}</pre><p class="muted" style="font-size:13px">${n} lines after the change. Green lines were added;
      red lines were removed, and show where they were.</p>`
    : `<p class="muted">This mock carries the ${view === 'whole' ? 'whole text of four' : 'real diffs of six'} ts-0178
      files only. In the app every file opens both ways.</p>`;
  const nav = (j, w) => (j >= 0 && j < ch.files.length ? `<button class="btn" data-act="diff" data-id="${id}"
    data-v="${j}">${w}</button>` : '');
  modal(`<h2 class="mono" style="font-size:15px;overflow-wrap:anywhere">${esc(f.path)}</h2>
    <div class="frow"><span class="muted">${esc(id)} · ${esc(ch.where)} · <span class="add">+${f.add}</span>
      <span class="del">−${f.del}</span> · file ${i + 1} of ${ch.files.length}</span><span class="spacer"></span>
      <span class="seg" role="group" aria-label="Show"><button data-act="diffv" data-v="changes" data-id="${id}"
        data-x="${i}" aria-pressed="${view === 'changes'}">Changes</button><button data-act="diffv" data-v="whole"
        data-id="${id}" data-x="${i}" aria-pressed="${view === 'whole'}">Whole file</button></span>${nm(29)}</div>
    ${body}
    <div class="acts">${nav(i - 1, '‹ Previous file')}${nav(i + 1, 'Next file ›')}
      <button class="btn main" data-act="modal-close">Close</button></div>`, 'wide');
  const pre = $('#wholepre');
  if (pre) {
    const first = pre.querySelector('.a, .d');
    if (first) pre.scrollTop = Math.max(0, first.offsetTop - 60);
  }
}
function fileTurnModal(i) {

function openFresh() {

function addScratch() {
  const text = ($('#newtask') && $('#newtask').value.trim()) || 'A first task';
  const b = board();
  const n = b.tasks.length + 1;
  b.tasks.push({ id: `sc-${String(n).padStart(4, '0')}-new`, title: text, status: 'ready', epic: null,
    blockedBy: [], src: 'scratch', body: 'A scratch task. It stays on this machine until you share it.' });

setInterval(() => { if (state.screen === 'board' && state.surface === 'field' && !state.settings) {
  // A live tick leaves an open peek alone: in the app it re-reads the task it shows.
  const live = document.querySelector('.live');
  // Nor does it take your place in a box you type in, or an edge you drag.
  const busy = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('#dgrip').classList.contains('drag');
  if (live && $('#peek').hidden && !busy) render();
} }, 15000);
render();
