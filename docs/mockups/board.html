<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collide Board Mock</title>
<!--
  Design mock of Stage 6a, the board (IMPLEMENTATION_PLAN.md, Stage 6a). One file, no build, no dependencies.
  Open it in a browser. The "Mock" button (bottom left) switches scenarios and shows the numbered design notes.
  The look is the approachable pass of mockups A (Field) and C (Tracks): warm neutrals, Inter, colour for state only.
  Demo data: Collide's own planning items (statuses as of 2026-11-21, a few changed for the demo), and a made-up
  "pantry" board. Items ts-0179 to ts-0185 and fx-0001 are demo items, not filed.
  Round 2 (2026-11-22) adds, from the owner's notes: Comms, a Tracks preview with Optimize, a Graph layout beside
  Run order, "Describe what to show", the drawer's Changes and pack fields, and "Plan it first" on an empty board.
  Runs, sessions and research results are made up; the diffs of ts-0178 are its real ones (commit 660efc8).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --radius:14px;--radius-sm:10px;--radius-xs:7px;
  --background:#f8f6f2;--foreground:#1f1b16;--card:#ffffff;--popover:#ffffff;
  --primary:#4f46e5;--primary-foreground:#ffffff;--primary-soft:#ecebfd;
  --secondary:#f1ede6;--secondary-foreground:#3b352d;
  --muted:#f3efe9;--muted-foreground:#675f55;--accent:#ebe6de;
  --destructive:#c62828;--border:#e7e1d8;--input:#d8d0c4;--ring:#4f46e5;
  --working:#0369a1;--waiting:#b45309;--blocked:#6f675d;--failed:#c62828;--done:#15803d;--cold:#a21caf;
  --code-bg:#f3efe8;--code-fg:#2b251e;
  --term-bg:#1c1a17;--term-fg:#e9e4db;--term-dim:#a39a8c;--term-acc:#a5abff;--term-ok:#6ee7a0;
  --overlay:rgb(40 30 20 / .42);
  --shadow:0 1px 2px rgb(60 40 20 / .06);
  --shadow-card:0 1px 2px rgb(60 40 20 / .05),0 8px 28px rgb(60 40 20 / .07);
  --shadow-lg:0 16px 48px rgb(40 25 10 / .2);
  --font-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --fs-xs:12.5px;--fs-sm:14px;--fs-base:15px;--fs-lg:17px;--fs-xl:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --background:#171513;--foreground:#f3efe9;--card:#211f1c;--popover:#292623;
  --primary:#8b93f8;--primary-foreground:#14122e;--primary-soft:#2c2e5e;
  --secondary:#2c2925;--secondary-foreground:#e8e2d8;--muted:#1d1b18;--muted-foreground:#aea699;--accent:#36322d;
  --destructive:#f0605d;--border:#3a3631;--input:#4b463f;--ring:#8b93f8;
  --working:#38bdf8;--waiting:#fbbf24;--blocked:#aea699;--failed:#f87171;--done:#4ade80;--cold:#e879f9;
  --code-bg:#181614;--code-fg:#e9e4db;--overlay:rgb(0 0 0 / .62);
  --shadow:0 1px 2px rgb(0 0 0 / .4);--shadow-card:0 1px 2px rgb(0 0 0 / .35),0 8px 28px rgb(0 0 0 / .35);
  --shadow-lg:0 16px 48px rgb(0 0 0 / .6);color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#171513;--foreground:#f3efe9;--card:#211f1c;--popover:#292623;
  --primary:#8b93f8;--primary-foreground:#14122e;--primary-soft:#2c2e5e;
  --secondary:#2c2925;--secondary-foreground:#e8e2d8;--muted:#1d1b18;--muted-foreground:#aea699;--accent:#36322d;
  --destructive:#f0605d;--border:#3a3631;--input:#4b463f;--ring:#8b93f8;
  --working:#38bdf8;--waiting:#fbbf24;--blocked:#aea699;--failed:#f87171;--done:#4ade80;--cold:#e879f9;
  --code-bg:#181614;--code-fg:#e9e4db;--overlay:rgb(0 0 0 / .62);
  --shadow:0 1px 2px rgb(0 0 0 / .4);--shadow-card:0 1px 2px rgb(0 0 0 / .35),0 8px 28px rgb(0 0 0 / .35);
  --shadow-lg:0 16px 48px rgb(0 0 0 / .6);color-scheme:dark}
/* Category colours: colour is for state only, and every state is also written in words. */
:root{--c-backlog:var(--blocked);--c-ready:var(--primary);--c-active:var(--working);--c-review:var(--waiting);
  --c-done:var(--done);--c-dropped:var(--muted-foreground)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:400 var(--fs-base)/1.5 var(--font-sans);
  font-feature-settings:"tnum" 1;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd,pre,.mono{font-family:var(--font-mono);font-size:.92em}
code{background:var(--code-bg);color:var(--code-fg);padding:1px 5px;border-radius:5px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--primary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted-foreground)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
  stroke-linejoin:round;flex:none}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--input);background:var(--card);
  border-radius:var(--radius-xs);padding:6px 12px;font-size:var(--fs-sm);font-weight:500;cursor:pointer;
  white-space:nowrap}
.btn:hover{background:var(--secondary)}
.btn.main{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.main:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--secondary)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tc:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);line-height:1.4;padding:1px 8px;
  border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);
  white-space:nowrap}
.chip .dot,.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.chip.warn{color:var(--waiting);border-color:color-mix(in srgb,var(--waiting) 40%,var(--border))}
.chip.bad{color:var(--failed);border-color:color-mix(in srgb,var(--failed) 40%,var(--border))}
.chip.info{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.st{font-weight:500}
.cat-backlog{color:var(--c-backlog)}.cat-ready{color:var(--c-ready)}.cat-active{color:var(--c-active)}
.cat-review{color:var(--c-review)}.cat-done{color:var(--c-done)}.cat-dropped{color:var(--c-dropped)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* Design-note markers: shown only when design notes are on */
.nm{display:none;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;background:var(--cold);color:#fff;font:600 11px/1 var(--font-sans);vertical-align:middle;
  margin-left:4px;cursor:help;flex:none}
body.notes .nm{display:inline-flex}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px
  max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-lg)}
.logo{color:var(--primary);display:inline-flex}
.logo .ic{width:22px;height:22px}
.crumb{display:flex;align-items:center;gap:4px;position:relative}
.crumb .sep{color:var(--muted-foreground)}
.crumbbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  border-radius:var(--radius-xs);padding:4px 8px;cursor:pointer;font-weight:500}
.crumbbtn:hover,.crumbbtn[aria-expanded="true"]{background:var(--secondary);border-color:var(--border)}
.crumbbtn small{font-weight:400;color:var(--muted-foreground)}
.tabs{display:flex;gap:4px;margin-inline:auto}
.tab{display:flex;flex-direction:column;align-items:flex-start;border:0;background:transparent;cursor:pointer;
  padding:5px 12px;border-radius:var(--radius-sm);line-height:1.2;font-weight:600}
.tab small{font-weight:400;font-size:12px;color:var(--muted-foreground)}
.tab:hover{background:var(--secondary)}
.tab[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary)}
.tab.later{opacity:.6}
.topr{display:flex;align-items:center;gap:8px}

/* Popover menus */
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:320px;background:var(--popover);
  border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px}
.pop h4{margin:6px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted-foreground);font-weight:600}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;
  padding:7px 8px;border-radius:var(--radius-xs);cursor:pointer}
.opt:hover{background:var(--secondary)}
.opt[aria-current="true"]{background:var(--primary-soft)}
.opt .grow{flex:1;min-width:0}
.opt .sub{display:block;font-size:12.5px;color:var(--muted-foreground)}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}

/* Layout */
.stage{flex:1;display:flex;min-height:0}
.content{flex:1;min-width:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px
  max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);
  background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,var(--border));flex-wrap:wrap}
.banner.warn{background:color-mix(in srgb,var(--waiting) 10%,var(--card));
  border-color:color-mix(in srgb,var(--waiting) 35%,var(--border))}
.banner .grow{flex:1;min-width:220px}

/* Filter bar */
.filters{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fgroup .lbl{font-size:12.5px;color:var(--muted-foreground);font-weight:500}
.chipbtn{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 10px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);cursor:pointer}
.chipbtn:hover{background:var(--secondary)}
.chipbtn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.chipbtn .n{color:var(--muted-foreground);font-size:12px}
.ftext{border:1px solid var(--input);border-radius:var(--radius-xs);padding:5px 10px;background:var(--card);
  width:260px;max-width:100%}
.spacer{flex:1}
details.adv summary{cursor:pointer;font-size:13px;color:var(--muted-foreground)}
details.adv .cel{margin-top:6px;padding:8px 10px;background:var(--code-bg);border-radius:var(--radius-xs);
  overflow-x:auto}
details.adv .cel code{background:none;padding:0;white-space:pre}

/* View bar */
.viewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.viewbar h1{font-size:var(--fs-xl);font-weight:650}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:var(--radius-xs);overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 10px;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--input)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground)}
.live .dot{color:var(--done);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Board */
.cols{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:10px;min-height:0}
.col{flex:0 0 280px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;display:flex;flex-direction:column;gap:8px}
.colh{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 4px}
.colh .grow{flex:1;min-width:0}
.colh .name{font-weight:600;display:flex;align-items:center;gap:6px}
.colh .name .dot{color:inherit}
.colh .sub{font-size:12.5px;color:var(--muted-foreground)}
.colh .count{font-size:13px;color:var(--muted-foreground);font-weight:500}
.col.shut{flex:0 0 52px;padding:10px 4px;align-items:center;cursor:pointer}
.col.shut .vert{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;
  font-weight:600;white-space:nowrap}
.col .empty{font-size:13px;color:var(--muted-foreground);padding:6px 4px}
.tc{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;box-shadow:var(--shadow);
  cursor:pointer}
.tc:hover{border-color:var(--input);box-shadow:var(--shadow-card)}
.tc.lit{border-color:var(--c-active);box-shadow:0 0 0 1px var(--c-active),var(--shadow)}
.tc.sel{outline:2px solid var(--ring);outline-offset:1px}
.tc.flash{animation:flash 2s ease-out}
@keyframes flash{0%{background:var(--primary-soft);transform:scale(1.02)}100%{background:var(--card)}}
.tc-t{font-weight:500;line-height:1.35}
.tc-m{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground)}
.tc-c{display:flex;gap:5px;flex-wrap:wrap}
.tc.dropped .tc-t{text-decoration:line-through;color:var(--muted-foreground)}

/* Run order */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.step .lab{padding-top:8px}
.step .lab b{display:block}
.step .lab span{font-size:12.5px;color:var(--muted-foreground)}
.step .row{display:flex;gap:10px;flex-wrap:wrap}
.step .row .tc{width:280px}
@media (max-width:640px){.step{grid-template-columns:1fr}}

/* Drawer */
.drawer{flex:0 0 460px;max-width:100%;border-left:1px solid var(--border);background:var(--card);overflow:auto;
  display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dh{position:sticky;top:0;background:var(--card);padding:14px 18px 10px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;z-index:2}
.dh .row{display:flex;align-items:center;gap:8px}
.dh h2{font-size:19px;font-weight:650;line-height:1.3}
.db{padding:14px 18px 40px;display:flex;flex-direction:column;gap:20px}
.ds h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);
  font-weight:600;margin-bottom:8px;display:flex;align-items:center}
.md{line-height:1.6;max-width:65ch}
.md p{margin:0 0 .7em}
.md ul{margin:0 0 .7em;padding-left:1.2em}
.md h4{margin:.9em 0 .4em;font-size:var(--fs-base)}
.md pre{background:var(--code-bg);padding:8px 10px;border-radius:var(--radius-xs);overflow-x:auto}
.md .gone{color:var(--muted-foreground);font-style:italic}
.links{display:flex;flex-direction:column;gap:4px}
.lk{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:5px 6px;
  border-radius:var(--radius-xs);cursor:pointer;width:100%}
.lk:hover{background:var(--secondary)}
.lk .grow{flex:1;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.t th{text-align:left;font-weight:500;color:var(--muted-foreground);font-size:12.5px;padding:4px 8px;
  border-bottom:1px solid var(--border)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr.diff td{background:color-mix(in srgb,var(--waiting) 8%,transparent)}
table.t tr.coll td{background:color-mix(in srgb,var(--failed) 7%,transparent)}
details.eng summary{cursor:pointer;font-size:var(--fs-sm);color:var(--muted-foreground)}
details.eng pre{background:var(--code-bg);padding:8px 10px;border-radius:var(--radius-xs);overflow-x:auto;
  font-size:12.5px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0;font-size:var(--fs-sm)}
dl.kv dt{color:var(--muted-foreground)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Panels: settings, welcome, empty, missing, later */
.panel{padding:22px 24px;display:flex;flex-direction:column;gap:14px;max-width:880px}
.panel.center{margin:24px auto;width:100%}
.panel h1{font-size:var(--fs-xl);font-weight:650}
.panel h2{font-size:var(--fs-lg);font-weight:600}
.panel p{margin:0;max-width:68ch}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:10px 4px;
  border-bottom:1px solid var(--border)}
.chk .ok{color:var(--done)}.chk .no{color:var(--failed)}.chk .opt{color:var(--muted-foreground)}
.chk .fix{font-size:var(--fs-sm);color:var(--muted-foreground);margin-top:2px}
.setgrid{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.snav button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:var(--radius-xs);
  cursor:pointer}
.snav button[aria-current="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.layer{font-size:12.5px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid var(--border);
  white-space:nowrap}
.layer.l-default{color:var(--muted-foreground)}
.layer.l-user{color:var(--working);border-color:color-mix(in srgb,var(--working) 35%,var(--border))}
.layer.l-repo{color:var(--cold);border-color:color-mix(in srgb,var(--cold) 35%,var(--border))}
.over{text-decoration:line-through;color:var(--muted-foreground)}
@media (max-width:760px){.setgrid{grid-template-columns:1fr}.snav{flex-direction:row;flex-wrap:wrap;position:static}}
.prompt{display:flex;flex-direction:column;gap:8px}
.prompt textarea{border:1px solid var(--input);border-radius:var(--radius-sm);padding:10px 12px;min-height:84px;
  resize:vertical;background:var(--card)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tile{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);
  display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:999px;background:var(--secondary);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}

/* Modal, toast, mock panel */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:16px}
.overlay[hidden]{display:none}
.modal{width:min(520px,100%);background:var(--popover);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:var(--fs-lg);font-weight:650}
.modal p{margin:0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.modal input[type=text]{border:1px solid var(--input);border-radius:var(--radius-xs);padding:7px 10px;width:100%;
  background:var(--card)}
.modal ul{margin:0;padding-left:1.2em}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--dockb,0px));transform:translateX(-50%);
  background:var(--foreground);
  color:var(--background);padding:9px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:60;
  font-size:var(--fs-sm);max-width:min(560px,calc(100% - 32px))}
.toast[hidden]{display:none}
.mockbtn{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + var(--dockb,0px));z-index:40;
  background:var(--cold);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;
  box-shadow:var(--shadow-lg)}
.mock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(62px + var(--dockb,0px));
  z-index:40;width:min(440px,calc(100% - 32px));max-height:calc(100% - 90px - var(--dockb,0px));overflow:auto;
  background:var(--popover);
  border:2px solid var(--cold);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:14px 16px;
  display:flex;flex-direction:column;gap:10px}
.mock[hidden]{display:none}
.mock h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--cold)}
.mock .grid{display:flex;flex-wrap:wrap;gap:6px}
.notes-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px}

     conn: &Connection,
     seq: u64,
     wall_ms: u64,
     run: &str,
     to: &RunState,

     let state = serde_json::to_string(to).map_err(|error| unreadable(run, error))?;
     let live = is_live(to);

         params![run, state, live, to_i64(seq), to_i64(wall_ms), ended_ms],
     )
     .map_err(|e| sql_error("writing a run", e))?;

     /// The run's latest state, from its row. `None` for a run that has no `run.transition` event.
     pub fn run_state(&self, run: &str) -> Result<Option<RunState>, StoreError> {
         let state: Option<String> = self
             .connect()?
             .query_row("SELECT state FROM runs WHERE run = ?1", [run], |row| {
                 row.get(0)
             })
             .optional()
             .map_err(|e| sql_error("reading a run's state", e))?;

             .map(|text| serde_json::from_str(&text).map_err(|error| unreadable(run, error)))

     /// Links a run to its board, tasks, line and workflow, replacing what it had. `false` when the run has no row yet,
     /// which is a run with no `run.transition` event: nothing is written.
     pub fn set_run_launch(&self, run: &str, launch: &RunLaunch) -> Result<bool, StoreError> {
         let context = "linking a run";
         let mut conn = self.connect()?;
         let tx = conn
             .transaction_with_behavior(TransactionBehavior::Immediate)
             .map_err(|e| sql_error(context, e))?;
         let changed = tx
             .execute(
                 "UPDATE runs SET board = ?2, line = ?3, workflow = ?4 WHERE run = ?1",
                 params![run, launch.board, launch.line, launch.workflow],
             )
             .map_err(|e| sql_error(context, e))?;
         if changed == 0 {
             return Ok(false);
         }
         tx.execute("DELETE FROM run_tasks WHERE run = ?1", [run])
             .map_err(|e| sql_error(context, e))?;
         for (order, task) in launch.tasks.iter().enumerate() {
             tx.execute(
                 "INSERT INTO run_tasks (run, ord, task, status) VALUES (?1, ?2, ?3, ?4)",
                 params![run, to_i64(order as u64), task.key, task.status],
             )
             .map_err(|e| sql_error(context, e))?;
         }
         tx.commit().map_err(|e| sql_error(context, e))?;
         Ok(true)
     }

     /// The runs that match `filter`, newest first.
     pub fn runs(&self, filter: &RunFilter<'_>) -> Result<Vec<RunRow>, StoreError> {
         let mut clauses: Vec<&str> = Vec::new();
         let mut values: Vec<Value> = Vec::new();
         if let Some(board) = filter.board {
             clauses.push("board = ?");
             values.push(Value::Text(board.to_string()));
         }
         if let Some(task) = filter.task {
             clauses.push("run IN (SELECT run FROM run_tasks WHERE task = ?)");
             values.push(Value::Text(task.to_string()));
         }
         match filter.scope {
             RunScope::Live => clauses.push("live = 1"),
             RunScope::Finished => clauses.push("live = 0"),
             RunScope::All => {}
         }
         if let Some(before) = filter.before {
             clauses.push("opened_seq < ?");
             values.push(Value::Integer(to_i64(before)));
         }
         values.push(Value::Integer(i64::from(filter.limit)));
         let condition = if clauses.is_empty() {
             String::new()
         } else {
             format!("WHERE {}", clauses.join(" AND "))
         };
         let context = "reading the runs";
         let conn = self.connect()?;
         let mut statement = conn
             .prepare(&format!(
                 "SELECT {COLUMNS} FROM runs {condition} ORDER BY opened_seq DESC LIMIT ?"
             ))
             .map_err(|e| sql_error(context, e))?;
         let rows = statement
             .query_map(params_from_iter(values), row_of)
             .map_err(|e| sql_error(context, e))?
             .collect::<Result<Vec<_>, _>>()
             .map_err(|e| sql_error(context, e))?;
         rows.into_iter().map(|row| finish(&conn, row)).collect()
     }
 }
 
 /// The row with its state read and its tasks.
 fn finish(conn: &Connection, (mut row, state): (RunRow, String)) -> Result<RunRow, StoreError> {
     row.state = serde_json::from_str(&state).map_err(|error| unreadable(&row.run, error))?;
     let context = "reading a run's tasks";
     let mut statement = conn
         .prepare("SELECT task, status FROM run_tasks WHERE run = ?1 ORDER BY ord")
         .map_err(|e| sql_error(context, e))?;
     row.tasks = statement
         .query_map([&row.run], |task| {
             Ok(RunTaskRef {
                 key: task.get(0)?,
                 status: task.get(1)?,
             })
         })
         .map_err(|e| sql_error(context, e))?
         .collect::<Result<Vec<_>, _>>()
         .map_err(|e| sql_error(context, e))?;
     Ok(row)
 }

 //! A run as `run.list` and `run.get` give it (ts-0076-cw; 0.8, Run): the run's row in the store ([`crate::run_store`
~]),
 //! its phases and the times of their spans ([`crate::metrics_store`]), and its workspace folder. The function here is
 //! plain: the daemon reads the parts and this puts them together, so a test hands it the parts.
 //!
 //! - **A run's state is its row's**, not the phases': the row is what the run's own `run.transition` events said, and
 //!   it is the same after a restart.
 //! - **A phase is `agent`, with one instance.** Every phase the daemon has run is an agent phase: the other kinds come
 //!   with the workflow engine. The instance is named for the phase, and has no model or session id here.
 //! - **A phase's times are its spans'**: it started when its first span opened, and ended when its last one closed. A
 //!   phase whose last span is open has no end. A phase entered again has a span for each round, so its round is the
 //!   number of its spans (at least one).
 //! - **The text of a task's status is not read.** The status is carried as it was given.
 
 use crate::metrics_store::{Span, SpanKind};
 use crate::run_store::RunRow;
 use collide_core::owner::{InstanceSummary, PhaseKindWire, PhaseSummary, RunSummary};
 use collide_core::state::PhaseState;
 use std::collections::BTreeMap;
 
 /// The summary of the run, and how often each of its phases was entered.
 pub fn summarize(
     row: &RunRow,
     phases: &[(String, PhaseState)],
     spans: &[Span],
     workspace: Option<String>,
 ) -> (RunSummary, BTreeMap<String, u32>) {
     let mut rounds = BTreeMap::new();
     let mut summaries: Vec<PhaseSummary> = phases
         .iter()
         .map(|(name, state)| {
             let own: Vec<&Span> = spans
                 .iter()
                 .filter(|span| span.kind == SpanKind::Phase && span.phase.as_deref() == Some(name))
                 .collect();
             let round = u32::try_from(own.len()).unwrap_or(u32::MAX).max(1);
             rounds.insert(name.clone(), round);
             PhaseSummary {
                 name: name.clone(),
                 kind: PhaseKindWire::Agent,
                 round,
                 instances: vec![InstanceSummary {
                     id: name.clone(),
                     model: None,
                     session_id: None,
                     state: state.clone(),
                 }],
                 started_ms: own.first().map(|span| wall_ms(span.started_wall_ms)),
                 ended_ms: own.last().and_then(|span| span.ended_wall_ms).map(wall_ms),
                 gate_results: BTreeMap::new(),
                 take_over: None,
             }
         })
         .collect();
     summaries.sort_by(|a, b| (a.started_ms, &a.name).cmp(&(b.started_ms, &b.name)));
     let summary = RunSummary {
         id: row.run.clone(),
         tasks: row.tasks.clone(),
         line: row.line.clone(),
         workflow: row.workflow.clone(),
         state: row.state.clone(),
         started_ms: row.started_ms,
         ended_ms: row.ended_ms,
         workspace,
+        task_file: row.task_file.clone(),
         phases: summaries,
         warnings: Vec::new(),
     };
     (summary, rounds)
 }
 
 fn wall_ms(ms: i64) -> u64 {
     u64::try_from(ms).unwrap_or(0)
 }

    "ts `-`.\n- The fake's illegal-move message has other words and one line; the real CLI's names ",
    "the transition and the legal moves\n  on two lines. Both exit 2 with nothing on standard outpu",
    "t. The fake follows the real shape, in made-up words.\n- The first listing right after a re-tr",
    "ust warns \"source `plan` may be out of date: the line ... is not trusted\". It\n  does not.\n",
    "- `collide run`",
  ].join('') },
  { id: "ts-0151-fk", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0137-pg"],
    title: "Corpus: a changed item keeps the collections of its last listing", body: [
    "## Goal\n\n`apply_changed` in `core/src/corpus.rs` updates a held copy from `task.changed` wit",
    "h the new state and version and keeps\nthe rest, `collections` included. A collection can chan",
    "ge without its member's file changing: the Orchard pack's human\nqueue (`plan:queue`, from `./",
    "plan status --format json`, `ts-0137-pg`) and an epic's set (`ts-0148-cv`). So a question\nres",
    "olved on disk stays in `decisions-needed` until the source is listed again, and a question tha",
    "t comes to need a\nperson shows only then. Found at the `ts-0137-pg` build (its second decisio",
    "n).\n\n## Success criteria\n\n- Over the fixture `kinds` tree, through the daemon: a queued qu",
    "estion set to `resolved` on disk leaves\n  `decisions-needed` once the watcher has reported, w",
    "ith no restart and no relisting asked for.\n- A question set to `needs: human` on disk joins t",
    "he view the same way.\n- An epic's collection follows a change of its epic file the same way.",
    "\n- A source with no collections makes no more provider calls per change than today.",
  ].join('') },
  { id: "ts-0152-jq", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0141-sn"],
    title: "CLI: a listing says when the board's line cannot be read", body: [
    "## Goal\n\nWhen the daemon cannot read the board's line (`board_plan` fails in `look`, `host/s",
    "rc/corpus_service.rs`) or list its\ncheckouts (`discover`), it logs the error and returns. No ",
    "source of the line is named, so `collide tasks` lists the\nscratch source alone, prints nothin",
    "g on stderr and exits 0: the silent empty board of `ts-0141-sn`, one step earlier.\nFound at t",
    "he `ts-0141-sn` review (the builder's Not done).\n\n## Success criteria\n\n- `task.list` carri",
    "es, on its first page, that the board's sources are not read and why.\n- `collide tasks`, `tas",
    "ks --view` and `tasks --ready` print one stderr line with the reason and exit 1.\n- A board wh",
    "ose line reads again says nothing at the next look.",
  ].join('') },
  { id: "ts-0153-kp", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0145-cq", "ts-0148-cv", "ts-0150-dj"],
    title: "Orchard check: the fake CLI is held to the real one's envelopes", body: [
    "## Goal\n\nThe fake plan CLI (`fixtures/orchard-arch/plan`) drifted from the real one and ever",
    "y test still passed: the create\nenvelope's `data.id` was an object where the real CLI prints ",
    "a string (`ts-0145-cq`), and `ts-0150-dj` lists more. Drift\nis found only when an owner check",
    " runs the adapter on a real clone. Record the shape of the real CLI's envelopes once,\nand tes",
    "t the fake against those shapes, so drift fails the gates instead.\n\n## Success criteria\n\n-",
    " A shape reader in the fixtures turns one run of the CLI into its shape: exit code, whether st",
    "dout and stderr are\n  empty, stderr's line count, and the JSON envelope as its key tree with ",
    "each leaf's type. A string leaf is named by the\n  reference pack's id pattern it fits (`ids.t",
    "s`), or `string`. Values are kept only where they are the CLI's own words:\n  `command`, `sche",
    "ma_version`, a status the pack declares.\n- A recorder script runs, against a plan CLI and a r",
    "oot given as arguments, each command the adapter calls: `status`,\n  `set` (a legal move and a",
    "n illegal one), and `new task`. It write",
  ].join('') },
  { id: "ts-0154-gr", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Bounded runs: output not read in time is never taken as empty output", body: [
    "## Goal\n\n`run_bounded` (`host/src/bounded_run.rs`) gives each pipe's reader a grace of 2 s (",
    "`PIPE_GRACE`) after the child ends,\nso a grandchild that keeps a pipe open (a hook, an ssh ma",
    "ster) cannot hold the daemon. A reader that has not delivered\nby then gives empty output (`un",
    "wrap_or_default`), with the child's real exit code. A caller that reads stdout then takes\nmis",
    "sing output for the reply: in the gates of `ts-0148-cv` (2026-11-19, load about 28), `git rev-",
    "parse` exited 0 and was\nread as \"expected a commit id, got \"\", failing a `task_daemon_cli`",
    " test that passed in the round before and alone.\nOutput that was not read to its end must nev",
    "er look like an empty reply.\n\n## Success criteria\n\n- `Captured` says which pipes were not ",
    "read to their end within the grace.\n- Each caller that reads stdout (`git_objects`, the board",
    "'s tool runs in `board_load`, the claude version probe,\n  `http_get`) fails on a cut stdout w",
    "ith a message that says the output was not read in time, never as the reply it\n  would parse.",
    " A caller that reads no stdout keeps today's behaviour.\n- The grace stays as it is: a grandch",
    "ild that holds a pipe still does not hold the run\n  (`a_grandchild_that_keeps_the_pipe_open_d",
    "oes_not_hold_back_the_exit_record` in `shim_child.rs` keeps passing).",
  ].join('') },
  { id: "ts-0155-wb", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "CLI: the first listing after a daemon restart waits for the whole relist", body: [
    "## Goal\n\nAfter a daemon restart, the first `collide tasks` takes as long as a cold start (5.",
    "5 s against 5.7 s on 1,659 tasks, the\nagent run of `ts-0121-xp`), though the store's corpus c",
    "ache (`ts-0116-wh`) is served at once. `ts-0150-dj` found why:\nthe daemon answers from the ca",
    "che with `refreshing: true` in about 0.07 s, and `Session::settled_list` in\n`host/src/task_da",
    "emon.rs` asks again until the relist of every source for every checkout ends. Nothing is wrong",
    "; the\nwait is unexplained.\n\n## Success criteria\n\n- Recommended: the CLI keeps waiting for",
    " the settled list (a script never gets a list that may be stale), and while it\n  waits on a l",
    "isting that is `refreshing` for longer than 0.5 s it prints one line on standard error saying ",
    "the daemon\n  is listing its sources again after a restart. Standard output is unchanged; `--j",
    "son` is unchanged.\n- Alternative, if the owner takes it: the CLI prints the cached list at on",
    "ce with a standard error line that it is the\n  last run's list, and `--wait` keeps today's be",
    "haviour. Faster, but a script reading the first output may act on a\n  stale list.",
  ].join('') },
  { id: "ts-0156-nt", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0151-fk"],
    title: "Orchard: its tasks are of kind task", body: [
    "## Goal\n\nAn Orchard task has no kind today (`ts-0137-pg`): the provider declares `adr`, `spi",
    "ke` and `question` only. So `collide\ntasks --kind task` is refused on a board whose only sour",
    "ce is Orchard's, and on a mixed board it lists Collide's tasks\nand not Orchard's (`ts-0150-dj",
    "`, Decision 1). The owner wants Orchard's tasks to count as tasks.\n\n## Success criteria\n\n-",
    " The Orchard plan provider declares the kind `task`, with the statuses it declares for tasks t",
    "oday, and every task it\n  lists or gets carries `kind: task`. ADRs, spikes and questions are ",
    "unchanged.\n- `collide tasks --kind task` on a board whose only source is Orchard's lists its ",
    "tasks and exits 0; on a board with\n  Collide's plan too, it lists the tasks of both.\n- The l",
    "isting and the text of `task <key>` show `task` for an Orchard task.\n- What reads a task's ki",
    "nd still works: the `ready` view, `decisions-needed`, the roles check (`ts-0135-cx`), `create`",
    ",\n  `setStatus` by status and by categor",
  ].join('') },
  { id: "ts-0157-hd", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0151-fk"],
    title: "Corpus: a changed item keeps its old title, fields and links", body: [
    "## Goal\n\n`Corpus::apply_changed` in `core/src/corpus.rs` updates a held copy from `task.chan",
    "ged` with the new state and version\nonly. The notification's `diff` names a changed title, li",
    "nk or field too, and the copy keeps the old one. So a title\nedited on disk lists with its old",
    " title, and a `blocked-by` link added on disk leaves readiness (the `ready` view,\n`collide ta",
    "sks --ready`) wrong, until the source is listed again. Found at the `ts-0151-fk` build.\n\n## ",
    "Success criteria\n\n- Through the daemon, over a fixture tree, with no restart and no relistin",
    "g asked for: a task whose title changes on\n  disk lists with the new title once the watcher h",
    "as reported; a ready task that gains a `blocked-by` link to an open\n  task leaves `--ready`; ",
    "one whose blocking link goes joins it.\n- The store's cache holds the new copy, so a restarted",
    " daemon serves it before its relist ends.\n- A change of the status alone makes no more provid",
    "er calls than today.\n- Every provider of the repo that sends `task.changed` (Collide's plan, ",
    "the Orchard pack's, the others under `fixtures/`\n  and `packs",
  ].join('') },
  { id: "ts-0158-ow", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0157-hd"],
    title: "Orchard: fetching one changed task rescans the checkout", body: [
    "## Goal\n\nSince `ts-0157-hd`, a `task.changed` whose `diff` names more than the status makes ",
    "the daemon fetch that one task with\n`get`, while it holds the board's gate. The Orchard `get`",
    " (`fixtures/packs/orchard/providers/plan/provider.ts`) scans\nthe whole checkout and, while a ",
    "question is open, runs `./plan status` (30 s cap). A branch switch or pull that edits N\ntask ",
    "files costs N scans and N plan CLI runs, one after another, and writes and other sources' noti",
    "fications wait for\nall of them.\n\n## Success criteria\n\n- A `get` for a checkout the watche",
    "r watches answers from the watcher's last read of it: no scan and no plan CLI run. A\n  `get` ",
    "for a checkout it does not watch reads as today.\n- That answer is what a fresh `get` would gi",
    "ve right after the read: the same task, body and collections.\n- With a question open, a burst",
    " of N task edits in one watcher read runs the plan CLI at most once for the watcher and\n  not",
    " once per fetch.",
  ].join('') },
  { id: "ts-0159-ra", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Loop page: the run card follows a stale Review item, not the newest run", body: [
    "## Goal\n\nIn `ts-0138-pn` step 6b (owner-run, 2026-11-21) a file run started from the owner's",
    " own Claude Code session never\nshowed on the loop page's run card, with the app connected to ",
    "the real daemon before the run started. The run itself\npassed: it ran, filed its follow-up an",
    "d ended with exit 0.\n\nThe likely cause is in `app/src/loop/loop.ts` `sync`. With no run foll",
    "owed, the page follows the run of the first Queue\nitem of kind `permission` or `review`, and ",
    "only falls back to the newest run (`run.list` with `limit: 1`) when there is\nnone. The real q",
    "ueue held a Review item of an older quick run (run `run-1795250812644-1`, from a mistaken firs",
    "t try of\nstep 6c, whose clone was later deleted), first in\n\n## Success criteria\n\n- A run ",
    "that starts while the page is open shows on the card within one reload, whether it was started",
    " from the page,\n  from `collide run` (a file run, with no task) or from a run's agent, and wi",
    "th an older run's Review or permission item\n  still waiting.\n- An older run's waiting item s",
    "tays in \"Needs you\", and opening it (its \"Open\" button) shows that run, as today.\n- The c",
    "ard keeps following a run the person picked or started from the page until a newer run starts.",
    "\n- The owner re-checks one look of `ts-0138-pn` step 6b: a file run from the owner's own term",
    "inal shows on the card.",
  ].join('') },
  { id: "ts-0160-th", status: "done", epic: "ep-004-qd", blockedBy: ["ts-0159-ra"],
    title: "Discard: a refusal goes unseen, and a Review item whose repository is gone stays", body: [
    "## Goal\n\nIn `ts-0138-pn` step 6c (owner-run, 2026-11-21) the owner pressed Discard on a quic",
    "k run's Review item and confirmed\n\"Delete this work? ... which hold 0 changed files ...\". N",
    "othing was deleted: the run's worktree and branch stayed (the\nowner removed them by hand), th",
    "e store still holds the Review item `run-1795253516592-2-review`, and the event log has\nno `s",
    "tep.intent` of `collide/discard` for any run. The owner saw no refusal they noticed.\n\nWhat m",
    "ost likely happened, from the store and the code:\n\n- The page followed the older run `run-17",
    "95250812644-1` (`ts-0159-ra`), whose Review item is first in the queue, so the\n  Review card ",
    "and its Discard were that run's. \"0 changed files\" is also what\n\n## Success criteria\n\n- ",
    "The Review card's Discard acts on the item the card shows, and the confirmation names its run.",
    "\n- A refused discard shows its words on the page until the person dismisses them.\n- A Review",
    " item whose repository is gone can be cleared: Discard deletes the run's worktree folder by th",
    "e path the run\n  recorded, drops the item, and says the branch went with the repository.\n- A",
    " run made by an earlier daemon process can be discarded after a restart.",
  ].join('') },
  { id: "ts-0161-ta", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Corpus: a watch update keeps a stale row when another file takes an item's id", body: [
    "## Goal\n\nIn `ts-0138-pn` step 7 (agent-run, 2026-11-20) a copy of a task file with the same ",
    "`id:` was committed while the daemon\nran. The next `collide tasks` listed two rows with the o",
    "ne key, as well as the `skipped` line for the file set aside.\n`collide task reid <id>` (bare ",
    "id) was then refused \"matches 2 items\", exit 3. After the daemon was ended and started,\nthe",
    " listing had one row and the reid passed. Right after the reid, the first listing still printe",
    "d one `skipped` line\nfor a file that no longer clashed; the next listing printed none.\n\nSo ",
    "the watcher's update path and a full listing disagree: a full listing keeps one row per key an",
    "d sets the other file\naside, while a watch update adds the se\n\n## Success criteria\n\n- Aft",
    "er a watch update that brings a second file with an item's id, the corpus holds one row for th",
    "e key, the same one\n  a full listing holds, and the other file is listed as skipped with the ",
    "same reason.\n- After the clash is resolved (reid, or the file removed), the next listing has ",
    "no `skipped` line for it.\n- A bare-id `collide task reid` on the clash works with the daemon ",
    "running, with no restart.",
  ].join('') },
  { id: "ts-0162-yh", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Orchard fixtures: the common section headings", body: [
    "## Goal\n\nIn `ts-0138-pn` step 8b (agent-run, 2026-11-20) the frontmatter keys of the fixture",
    " ADRs, spikes and questions in\n`fixtures/orchard-arch/kinds/arch/` matched the real files, bu",
    "t the fixtures have no `##` headings at all. The real\nfiles share a few: an ADR has a context",
    ", a decision, rejected alternatives and consequences; a spike and a question\nmost often have ",
    "a question section. The provider reads sections only from epic files today, so nothing behaves",
    "\ndifferently. The fixtures should still look like the real files, so a later reader of sectio",
    "ns is tested on them.\n\n## Success criteria\n\n- Each fixture ADR has the four common heading",
    "s, and most fixture spikes and questions have the question heading, with\n  made-up text. Gene",
    "ric heading words only: no text of a real file.\n- Step 8b's heading comparison in `ts-0138-pn",
    "` shows only headings that are rare in the real tree.",
  ].join('') },
  { id: "ts-0163-su", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Daemon log: a board that cannot be read", body: [
    "## Goal\n\nTwo kinds of noise in the real daemon's log, seen in `ts-0138-pn` (2026-11-21):\n\n",
    "- A board whose folder was deleted (two boards of earlier checks, under `/tmp`) is tried again",
    " for ever: the corpus logs\n  \"its sources are not read\" for each, about every 10 s, as long",
    " as the daemon runs (`corpus_service.rs`).\n- When the daemon stops, each board's plan source ",
    "logs \"plan could not be listed: ... `list` came before `initialize`\"\n  (`supervisor.rs`): a",
    " relist races the providers' shutdown.\n\n## Success criteria\n\n- A board whose folder is gon",
    "e is logged once when it goes, and again only when it changes (comes back, or is removed\n  fr",
    "om the daemon). Its retries back off.\n- A stop logs no listing failure for a source that is b",
    "eing shut down.",
  ].join('') },
  { id: "ts-0164-pa", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "App and daemon: a HOME that is gone is made again", body: [
    "## Goal\n\nIn `ts-0138-pn` step 6 (2026-11-21) the owner started the app from a terminal that ",
    "still held the check's `env.sh`,\nwhose `HOME` and `COLLIDE_DAEMON_ROOT` named a folder alread",
    "y deleted. The app started a daemon there, which made the\nfolder again, and ran with no word ",
    "that its home was new. The app never saw the real daemon, so the page showed none of\nthe owne",
    "r's runs, and it looked like a bug of the page.\n\n## Success criteria\n\n- The daemon refuses",
    " to start when `HOME` names no folder, and says so with the path; it never makes `HOME`.\n- Th",
    "e app shows that refusal as its words, not as an empty page.\n- `COLLIDE_DAEMON_ROOT` that nam",
    "es no folder is still made, as today (tests and checks make it fresh).",
  ].join('') },
  { id: "ts-0165-ab", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Daemon stop: its environment capture shell outlives it", body: [
    "## Goal\n\nSeen while reviewing `ts-0159-ra` (2026-11-21): the app's browser spec `app/browser",
    "/bridge.spec.ts` \"the bridge\nrefuses a foreign Host, a foreign Origin and a call without the",
    " token\" fails about half the time, at HEAD as well. The\nfixture's check \"nothing of the wor",
    "ld is left running\" finds two processes of the daemon's login-shell capture\n(`base_env.rs`: ",
    "`fake-shell -l -i -c printf ... env -0 ...`) still alive after the bridge and the daemon stopp",
    "ed. The\ncapture runs in a session of its own (`setsid`) and is killed after reading, so a cap",
    "ture still in flight when the\ndaemon stops outlives it. `pnpm test` is therefore red about ha",
    "lf the time for any build.\n\n## Success criteria\n\n- When the daemon stops, every environmen",
    "t capture in flight is ended (its session killed) before the daemon exits.\n- `bridge.spec.ts`",
    " passes 10 runs out of 10, run alone and inside `pnpm test`.\n- A capture that finishes normal",
    "ly is unchanged: killed after reading, under its timeout.",
  ].join('') },
  { id: "ts-0166-rq", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Claude versions: a run right after the daemon starts says it does not look up the published version",
    body: [
    "## Goal\n\nSeen while reviewing `ts-0163-su` (2026-11-21): the test\n`run_command::a_task_file",
    "_run_prints_both_versions_then_follows_the_phase_and_prints_its_record`\n(`host/tests/adapters",
    "/claude/run_command.rs`) fails often, at HEAD as well, with\n\"claude published: not known (th",
    "is daemon does not look it up)\" where it expects the published versions. The daemon\nsets its",
    " published-version source only once its start capture of the environment has ended (`Daemon::s",
    "tart`,\n`claude_published.source(captured.vars)`), and `ClaudeVersions::status` answers \"this",
    " daemon does not look it up\"\n(`NO_SOURCE`) whenever no source is set. A `collide run` that a",
    "sks `daemon.agent_versions` before the capture ends\nis told the\n\n## Success criteria\n\n- W",
    "hile the daemon's start capture is still running, `daemon.agent_versions` says the published v",
    "ersion is not known\n  yet, not that the daemon does not look it up. `collide run` prints \"cl",
    "aude published: not known yet\".\n- A daemon with no source at all (`PublishedChoice::Off`) st",
    "ill says it does not look it up.\n- The test above passes 10 runs in a row, run alone.",
  ].join('') },
  { id: "ts-0167-jj", status: "done", epic: "ep-004-qd", blockedBy: [],
    title: "Boards: git in a folder that is gone says to install git", body: [
    "## Goal\n\nSeen in the real daemon's log during the owner's re-check of `ts-0138-pn` steps 6b ",
    "and 6c (2026-11-21): for each board\nwhose folder was deleted, the corpus logged \"`git` did n",
    "ot run (No such file or directory (os error 2)); install git\nand try again\". Git was install",
    "ed; the folder was gone. The private `git` helper in `host/src/boards.rs` runs\n`Command::new(",
    "\"git\").current_dir(folder)`, and a `current_dir` that does not exist fails the spawn with `N",
    "otFound`,\nwhich the helper reports as git missing. `ts-0163-su` already makes the corpus log ",
    "the gone folder as its reason, but\nevery other caller of the helper (quick runs, accept, the ",
    "board lines) still gives the wrong fix.\n\n## Success criteria\n\n- Git run in a folder that d",
    "oes not exist says the folder is gone and names it, not that git is missing.\n- Git that is tr",
    "uly missing (not on `PATH`) still says to install git.",
  ].join('') },
  { id: "ts-0178-fw", status: "ready", epic: "ep-004-qd", blockedBy: [],
    title: "Loop page: a file run's card says its task is unknown", body: [
    "## Goal\n\nSeen in the owner's re-check of `ts-0138-pn` step 6b (2026-11-21): the run card sho",
    "wed a file run started with\n`collide run follow-up-probe.md`, as it should, but its Details s",
    "aid Task \"unknown\" and left Workflow and \"Branch the\nwork started from\" blank. A file run",
    " has no task, no workflow and no line by design (`host/src/file_run.rs`: one\nphase, no workfl",
    "ow, no board). The card reads as if something failed to load.\n\n## Success criteria\n\n- A fi",
    "le run's Details names what it ran from: the task file's path in place of \"unknown\", and no ",
    "blank rows.\n- A run with a task, a workflow and a line shows them as today.\n- A run whose ta",
    "sk is not found on any board still says so in words, not \"unknown\" alone.",
  ].join('') },
  { id: "ts-0168-tq", status: "ready", epic: "ep-005-hs", blockedBy: ["ts-0167-jj"],
    title: "Provider contract: the board's source block, provenance and a stale cause", body: [
    "## Goal\n\nA provider is told which GitHub repositories its board names and which repository i",
    "ts checkout came from. It can say who\nwrote a task and how far that author is trusted. It can",
    " say why it is stale. The daemon and the corpus carry all three.\nNo GitHub code yet: the late",
    "r items of Stage 5 build on this.\n\nWhat exists. `core/src/provider.rs` has `InitializeParams",
    " { config, root }`, `SourceStale { reason, checkout }`,\n`TaskChanged.actor` and `automated`, ",
    "`ChangeCause::Remote` and `RemovedCause::Deleted` and `Transferred`. `Task` has\n`fields`, `la",
    "bels`, `kind` and no author. `core/src/board.rs` has `GithubSource` (`repos`), `BoardSources` ",
    "and\n`check_board`, which validate `sources.github.repos`, a\n\n## Success criteria\n\n- A pro",
    "vider's `initialize` params carry `board.repos` from the line's `board.yaml` and `board.origin",
    "` from the `origin`\n  remote. A board with no `sources.github` block gets no repos. A checkou",
    "t with no remote, or a remote on another host,\n  gets a null origin.\n- A task with `provenan",
    "ce.association` `OWNER`, `MEMBER` or `COLLABORATOR` is trusted in a view, and one with any oth",

function parseAsk(q) {
  const s = q.toLowerCase();
  const f = { stage: new Set(), cat: new Set(), src: new Set(), text: '', deps: false };
  const said = [];
  let note = '';
  const b = board();
  for (const [id, e] of Object.entries(EPICS)) {
    const n = e.short.toLowerCase();
    const hit = n.startsWith('stage ') ? new RegExp(`stage\\s*${n.slice(6)}(?!\\d)`).test(s) : s.includes(n);
    if (hit && b.tasks.some((t) => t.epic === id)) { f.stage.add(id); said.push(e.short); }
  }
  const cats = [[/\bopen\b|not done|unfinished/, ['backlog', 'ready', 'active', 'review'], 'Open'],
    [/\b(done|finished|shipped)\b/, ['done'], 'Done'], [/\breview\b/, ['review'], 'In review'],
    [/being worked|in progress|\bactive\b/, ['active'], 'Active'], [/\bready\b|can start/, ['ready'], 'Ready'],
    [/\bbacklog\b/, ['backlog'], 'Backlog'], [/\bdropped\b|won'?t do/, ['dropped'], 'Dropped']];
  let open = false;
  for (const [re, cs, word] of cats) {
    if (open && word === 'Done') continue;
    if (re.test(s)) { cs.forEach((c) => f.cat.add(c)); said.push(word); if (word === 'Open') open = true; }
  }
  if (b.sources.length > 1) {
    if (/tracker/.test(s)) { f.src.add('tracker'); said.push('From the tracker'); }
    if (/\bplan(ning)?\b/.test(s)) { f.src.add('plan'); said.push('From planning'); }
  }
  const about = s.match(/\b(?:about|mentioning|named|called)\s+"?([^",.]+?)"?\s*$/);
  if (about) { f.text = about[1].trim(); said.push(`Search: ${f.text}`); }
  if (/waiting on|waits on|blocked|depends on/.test(s)) {
    f.deps = true; said.push('Has dependencies');
    note = 'A view looks at one task at a time, so "waiting on an open task" cannot be written: the tasks it waits '
      + 'on are not in sight. The nearest is "has dependencies". Run order and Graph show what is still open.';
  }
  if (/yesterday|last week|\bi\b.*\bbreak|broke/.test(s) && !said.length) {
    return { miss: 'A view sees each task\'s fields, not its history or who changed it. Try a stage ("stage 6"), a '
      + 'state ("open", "in review"), a source ("tracker"), or words to find ("about settings").' };
  }
  if (!said.length) {
    return { miss: 'Name a stage ("stage 6"), a state ("open", "in review", "done"), a source ("tracker"), or words '
      + 'to find ("about settings").' };
  }
  return { f, said, note };
}
function runAsk(q) {
  if (!q.trim()) return;
  const prev = state.ask && state.ask.prev ? state.ask.prev : state.filt;
  state.ask = { q, phase: 'asking', prev };
  render();
  setTimeout(() => {
    if (!state.ask || state.ask.q !== q) return;
    const r = parseAsk(q);
    if (r.miss) state.ask = { q, phase: 'miss', msg: r.miss, prev };
    else { state.filt = r.f; state.ask = { q, phase: 'done', said: r.said, note: r.note, prev }; }
    render();
  }, 900);
}

function divergence(t) {

/* ---------- run order ---------- */
function goalsOf() {
  const epics = [...new Set(visibleTasks().map((t) => t.epic).filter(Boolean))];
  return epics.filter((e) => visibleTasks().some((t) => t.epic === e && isOpen(t)));
}
function closureSteps(goal) {
  const set = new Map();
  const walk = (t) => {
    if (!t || !isOpen(t) || set.has(t.id)) return;
    set.set(t.id, t);
    t.blockedBy.forEach((id) => walk(byId(id)));
  };
  visibleTasks().filter((t) => t.epic === goal).forEach(walk);
  const level = new Map();
  const lv = (t) => {
    if (level.has(t.id)) return level.get(t.id);
    const deps = t.blockedBy.map((id) => set.get(id)).filter(Boolean);
    const n = deps.length ? 1 + Math.max(...deps.map(lv)) : 1;
    level.set(t.id, n);
    return n;
  };
  [...set.values()].forEach(lv);
  const steps = [];
  for (const t of set.values()) (steps[level.get(t.id) - 1] ||= []).push(t);
  return steps;
}
function pickGoal() {
  const goals = goalsOf();
  return goals.includes(state.goal) ? state.goal : (goals.includes(view().goal) ? view().goal : goals[0]);
}
function goalBar(goal, steps, words) {
  const opts = goalsOf().map((g) => `<option value="${g}" ${g === goal ? 'selected' : ''}>${esc(EPICS[g].name)}
    </option>`);
  return `<div class="frow"><label for="goal"><b>Toward</b></label><select id="goal" data-act="goal">${opts.join('')}
    </select><span class="muted">${[].concat(...steps).length} open tasks in ${steps.length} steps. ${words}</span>
    </div>`;
}
function runOrderHtml() {
  const goal = pickGoal();
  if (!goal) return '<p class="muted">Nothing open to put in order.</p>';
  const steps = closureSteps(goal);
  return goalBar(goal, steps, 'Only open tasks are walked; finished ones are left out.')
    + `<div class="steps">${steps.map((row, i) => `<div class="step"><div class="lab"><b>Step ${i + 1}</b>
      <span>${i === 0 ? 'can start now' : `after step ${i}`}</span></div>
      <div class="row">${row.map((t) => cardHtml(t, 'run')).join('')}</div></div>`).join('')}</div>`;
}

/* ---------- graph: the same steps as columns, with a line from each blocker ---------- */
function graphHtml() {
  const goal = pickGoal();
  if (!goal) return '<p class="muted">Nothing open to put in order.</p>';
  const steps = closureSteps(goal);
  const W = 236, H = 68, top = 34, left = 16, nw = 200, nh = 52;
  const pos = new Map();
  steps.forEach((row, i) => {
    // Order each column by where its blockers sit, so lines cross less.
    const key = (t) => {
      const ys = t.blockedBy.map((d) => pos.get(d)).filter(Boolean).map((p) => p.y);
      return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : 0;
    };
    [...row].sort((a, b) => key(a) - key(b)).forEach((t, j) => pos.set(t.id, { x: left + i * W, y: top + j * H }));
  });
  const width = left * 2 + (steps.length - 1) * W + nw;
  const height = top + Math.max(...steps.map((r) => r.length)) * H + 6;
  const edges = [];
  for (const [id, p] of pos) {
    for (const d of byId(id).blockedBy) {
      const q = pos.get(d);
      if (!q) continue;
      const x1 = q.x + nw, y1 = q.y + nh / 2, x2 = p.x, y2 = p.y + nh / 2, mx = (x1 + x2) / 2;
      edges.push(`<path data-from="${d}" data-to="${id}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`);
    }
  }
  const labels = steps.map((_, i) => `<span class="lvl" style="left:${left + i * W}px">Step ${i + 1}${i === 0
    ? ' · can start now' : ''}</span>`);
  const nodes = [...pos].map(([id, p]) => {
    const t = byId(id), c = catOf(t);
    return `<button class="tc gnode ${c === 'active' ? 'lit' : ''} ${state.drawer === id ? 'sel' : ''}"
      data-act="open" data-id="${id}" style="left:${p.x}px;top:${p.y}px" title="${esc(t.title)}">
      <span class="tc-t">${esc(t.title)}</span><span class="tc-m"><span class="dot cat-${c}"></span>
      ${esc(shortId(id))} · ${esc(t.status)}</span></button>`;
  });
  return goalBar(goal, steps, 'A line runs from each blocker to what it holds up. Hover a task to light its lines.')
    + `<div class="graphwrap"><div class="graph" style="width:${width}px;height:${height}px">
    <svg width="${width}" height="${height}" aria-hidden="true">${edges.join('')}</svg>${labels.join('')}
    ${nodes.join('')}</div></div>`;
}
function lightGraph(id) {
  const near = new Set(id ? [id] : []);
  document.querySelectorAll('.graph path').forEach((p) => {
    const hot = !!id && (p.dataset.from === id || p.dataset.to === id);
    p.classList.toggle('hot', hot);
    if (hot) { near.add(p.dataset.from); near.add(p.dataset.to); }
  });
  document.querySelectorAll('.gnode').forEach((n) => n.classList.toggle('dim', !!id && !near.has(n.dataset.id)));
}

function mdInline(s) {
  // s is already escaped. Images never load; only http(s) links open, and they ask first. Ids peek.
  return idLinks(s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) =>
      `<span class="gone">[image not loaded: ${alt || 'no description'}, from ${src}]</span>`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) => {
      const raw = href.replace(/&amp;/g, '&');
      if (/^https?:\/\//i.test(raw)) {
        return `<a href="#" data-act="ext" data-href="${href}" title="Opens in your browser, after asking">${text}</a>`;
      }
      return `${text} <span class="gone">(link not opened: ${esc(raw.split(':')[0])}: links are never opened)</span>`;
    }));
}
function mdHtml(src) {
  const lines = esc(src).split('\n');
  const out = [];
  let list = null, para = [];
  const flush = () => {
    if (para.length) out.push(`<p>${mdInline(para.join(' '))}</p>`);
    para = [];
    if (list) out.push(`<ul>${list.map((li) => `<li>${mdInline(li)}</li>`).join('')}</ul>`);
    list = null;
  };
  for (const line of lines) {
    if (/^\s*$/.test(line)) { flush(); continue; }
    const h = line.match(/^#{1,4}\s+(.*)/);
    if (h) { flush(); out.push(`<h4>${mdInline(h[1])}</h4>`); continue; }
    const li = line.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (para.length) flush(); (list ||= []).push(li[1]); continue; }
    if (list && /^\s{2,}\S/.test(line)) { list[list.length - 1] += ' ' + line.trim(); continue; }
    if (list) flush();
    para.push(line);
  }
  flush();
  return out.join('');
}

// The best pick: a clear win with the same tests, else a faster one that runs fewer tests.
function bakeBest(o, p) {

  return i === undefined ? null : { i, n: p.indexOf(i), why: tone(i) === 'good' ? 'Faster in every pair, with the '
    + 'same tests.' : 'Faster in every pair, but it runs fewer tests: use it in Build, and keep the full run in '

  s.turns.forEach((t) => {

/* Up next: what starts next, in order; a group is one entry (note 46) */
function entryState(e, i) {
  const ts = e.tasks.map(byId).filter(Boolean);
  const asks = ts.reduce((n, t) => n + openQs(t).length, 0);
  if (ts.some((t) => catOf(t) === 'active')) return asks ? ['ask', 'Running · needs you'] : ['info', 'Running'];
  if (e.proposed) return ['warn', 'Proposed by the agent: keep it, or split it'];
  const out = ts.flatMap(openBlockers).filter((b) => !e.tasks.includes(b.id));
  if (out.length) {
    return ['', `Waits until ${shortId(out[0].id)} lands${out.length > 1 ? ` and ${out.length - 1} more` : ''}`];
  }
  if (i === 0 || state.overlap) return ['good', `Starts when a slot is free (${state.auto.cap} at once)`];
  return ['', 'Starts when the one before it lands'];
}

(() => {
  // The task panel's left edge: drag it, use the arrow keys on it, or double-click it for 460 px (note 39).
  const g = $('#dgrip');
  const setW = (w) => {
    const max = Math.max(360, Math.round(innerWidth * 0.7));
    state.dw = Math.min(max, Math.max(360, Math.round(w)));
    $('#drawer').style.flexBasis = `${state.dw}px`;
    g.setAttribute('aria-valuenow', String(state.dw));
  };
  g.addEventListener('pointerdown', (e) => {
    g.setPointerCapture(e.pointerId);
    g.classList.add('drag');
    e.preventDefault();
  });
  g.addEventListener('pointermove', (e) => {
    if (g.classList.contains('drag')) setW($('.stage').getBoundingClientRect().right - e.clientX);
  });
  const end = (e) => {
    if (!g.classList.contains('drag')) return;
    g.classList.remove('drag');
    try { g.releasePointerCapture(e.pointerId); } catch { /* already released */ }
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  g.addEventListener('dblclick', () => setW(460));
  g.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 120 : 40;
    if (e.key === 'ArrowLeft') setW(state.dw + step);
    else if (e.key === 'ArrowRight') setW(state.dw - step);
    else if (e.key === 'Home') setW(460);
    else return;
    e.preventDefault();
  });
})();

/* ---------- render ---------- */
function render() {
  hidePeek();
  HUBS = null;
  notedCard = { 5: false, 6: false, 7: false };
  $('#crumb').innerHTML = crumbHtml();
  $('#tabs').innerHTML = state.screen === 'welcome' ? '' : tabsHtml();
  $('#topr').innerHTML = state.screen === 'welcome' ? '' : topRightHtml();
  let html;
  if (state.screen === 'welcome') html = welcomeHtml();
  else if (state.settings) html = settingsHtml();
  else if (board().missing) html = missingHtml();
  else if (state.surface === 'field') html = fieldHtml();
  else if (state.surface === 'planning') html = planningHtml();
  else if (state.surface === 'tracks') html = tracksHtml();
  else if (state.surface === 'comms') html = commsHtml();
  else html = state.surface === 'queue' ? queueHtml() : laterHtml(state.surface);
  $('#content').innerHTML = html;
  const t = state.drawer && byId(state.drawer);
  const d = $('#drawer');
  d.hidden = !t || state.screen === 'welcome';
  if (t) d.innerHTML = foldSections(drawerHtml(t));
  $('#dgrip').hidden = d.hidden;
  d.style.flexBasis = `${state.dw}px`;
  const dk = $('#dock');
  const docked = !!state.dock && state.screen === 'board' && (state.settings || state.surface !== 'comms');
  dk.hidden = !docked;
  if (docked) {
    dk.className = `dock ${state.dock === 'min' ? 'min' : ''}`;
    dk.innerHTML = dockHtml();
