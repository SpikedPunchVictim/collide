[package]
name = "collide-host"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
collide-core = { path = "../core" }
serde_json = "1"
# The bounds of the link's framing (host/src/shim_link.rs): `core`'s messages are serde types, and `host` names the traits.
serde = "1"
# The store (host/src/store.rs). SQLite is built from source (`bundled`), so the daemon does not depend on the system's
# copy. It belongs to `host` and never to `core` (the dependency check).
rusqlite = { version = "0.42", features = ["bundled"] }

# The system calls of the clocks (host/src/clock.rs), the process readers (host/src/sysproc.rs) and the shim's setsid,
# wait4 and openpty (host/src/shim.rs). The shim's calls are Unix; the clock and process readers use their own on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The test doubles of `core` (0.15), so the shim's journal is replayed into a session double.
collide-core = { path = "../core", features = ["testing"] }

[[bin]]
name = "collide"
path = "src/bin/collide.rs"

[[bin]]
name = "collide-daemon"
path = "src/bin/collide-daemon.rs"

# The Claude adapter's integration tests (ts-0061-bg). They name Claude's environment variables, which only
# `host/src/adapters/claude/` and `host/tests/adapters/claude/` may do (the names check), so they sit below
# `tests/adapters/claude/` and need a target of their own: cargo does not find a test two folders down.
[[test]]
name = "claude_adapter"
path = "tests/adapters/claude/main.rs"

# The ACP engine's tests (Stage 3d): the fake ACP child and, with the later items, the session and the phases that use
# it. They sit below `tests/adapters/acp/`, beside the Claude adapter's, and need a target of their own for the same
# reason: cargo does not find a test two folders down.
[[test]]
name = "acp_adapter"
path = "tests/adapters/acp/main.rs"
